name: CI/CD - All Projects

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-react:
    name: Test React Fundamentals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-fundamentals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: react-fundamentals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  test-nextjs:
    name: Test Next.js Fullstack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-fullstack
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: nextjs-fullstack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test-vue:
    name: Test Vue Composition
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-composition
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: vue-composition/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  test-angular:
    name: Test Angular Enterprise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: angular-enterprise/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-react, test-nextjs, test-vue, test-angular]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: docker-compose build
